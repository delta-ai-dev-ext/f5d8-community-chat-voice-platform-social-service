entities:
- id: client
  label: Member client
  kind: annotation
  role: inbound
  row: 372
  evidence:
  - path: docs/user_stories.md
    quote: an authenticated end user (verified access token)
  - path: docs/architecture.md
    quote: Every flow below assumes an authenticated caller (local JWT verification;
      claims `sub` = user id).
- id: svc
  name: social_service
  label: social_service
  kind: service
  technology: kubernetes-pod
  role: service
  row: 260
  evidence:
  - path: docs/architecture.md
    quote: '`social_service` owns the **private social graph** of the platform'
  - path: docs/architecture.md
    quote: Any replica can serve any request.
- id: db
  label: social PostgreSQL
  kind: database
  technology: postgresql
  role: outbound
  row: 313
  evidence:
  - path: docs/architecture.md
    quote: All state is PostgreSQL; all integration is Kafka.
  - path: docs/architecture.md
    quote: Schema-owned tables (snake_case; all timestamps `timestamptz`; uuid v4
      keys; migrations applied at deploy time).
- id: kafka
  name: social_events
  label: social_events broker
  kind: broker
  technology: kafka
  role: outbound
  row: 10
  evidence:
  - path: docs/architecture.md
    quote: '`social_service` **produces only** on topic `social_events`; it consumes
      nothing.'
  - path: docs/architecture.md
    quote: Transactional outbox.
relationships:
- id: r-client
  source: client
  target: svc
  type: request
  interaction:
    channel: direct
    purpose: friend request, friend list and conversation API calls
    protocol: HTTP
  evidence:
  - path: docs/openapi_spec.yaml
    quote: 'openapi: "3.0.3"'
  - path: docs/architecture.md
    quote: is accepted on every HTTP call
- id: r-db
  source: svc
  target: db
  type: ownership
  evidence:
  - path: docs/architecture.md
    quote: All state is PostgreSQL; all integration is Kafka.
  - path: docs/architecture.md
    quote: The pair is canonicalized on write (`a = LEAST`, `b = GREATEST`), which
      makes duplicate inserts and mutual-removal races impossible at the storage layer.
- id: r-prod
  source: svc
  target: kafka
  type: event
  direction: forward
  interaction:
    channel: messaging
    purpose: publish friend_request_changed and conversation_changed
    protocol: Kafka
  messaging:
    role: producer
    topic: social_events
  evidence:
  - path: docs/architecture.md
    quote: '`social_service` **produces only** on topic `social_events`; it consumes
      nothing.'
  - path: docs/architecture.md
    quote: produces to Kafka
view:
  entities:
  - client
  - svc
  - db
  - kafka
  groups: []
  edges:
  - id: e-client
    source: client
    target: svc
    relationships:
